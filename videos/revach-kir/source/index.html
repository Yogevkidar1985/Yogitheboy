<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Kurkoos tile gap video</title>
<style>
@font-face{font-family:Heebo;font-weight:900;src:url(heebo-hebrew-900-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:900;src:url(heebo-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:Heebo;font-weight:700;src:url(heebo-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:700;src:url(heebo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Almoni;font-weight:400;src:url(almoni-400.woff2) format('woff2')}
@font-face{font-family:Almoni;font-weight:700;src:url(almoni-700.woff2) format('woff2')}
:root{--night:#07293a;--teal:#105572;--bp:#13506c;--mist:#8fb6c8;--paper:#f7f8fa;--red:#a90b0c;--gold:#ffd47a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bp)}
body{font-family:Almoni,Heebo,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#16597a 0%,#13506c 55%,#0d3f57 100%)}
#redbg{position:absolute;inset:0;background:var(--red);opacity:0}
.grid{position:absolute;inset:0;background-image:
 linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px),
 linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
 background-size:300px 300px,300px 300px,60px 60px,60px 60px;background-position:-1px -1px}
.h{font-family:Heebo;font-weight:900;letter-spacing:-.02em;line-height:1.04}
.lbl{font-family:Almoni;font-weight:700}
.crop{position:absolute;width:44px;height:44px;border-color:rgba(255,255,255,.55);border-style:solid;border-width:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;display:none}
#header{position:absolute;top:0;left:0;right:0;height:200px;z-index:20}
#logo{position:absolute;left:70px;top:78px;width:300px}
#chip{position:absolute;right:70px;top:84px;color:#fff;font-family:Almoni;font-weight:700;font-size:36px;padding:10px 0 8px;white-space:nowrap;display:flex;align-items:center;gap:16px}
#chip i{display:inline-block;width:22px;height:22px;background:var(--red)}
#caps{position:absolute;left:60px;right:60px;top:1215px;height:420px;z-index:15;display:flex;align-items:center;justify-content:center;text-align:center}
#capline{font-family:Heebo;font-weight:900;font-size:74px;line-height:1.22;letter-spacing:-.01em;text-shadow:0 4px 18px rgba(0,0,0,.3)}
#capline span{display:inline-block;padding:0 12px;margin:2px 0;border-radius:12px;transform-origin:50% 60%}
#endlogo{position:absolute;left:0;right:0;top:1250px;text-align:center;opacity:0;z-index:16}
#bottom{position:absolute;left:70px;right:70px;top:1680px;height:200px;z-index:20}
#prog{position:absolute;top:0;left:0;right:0;height:10px;display:flex;gap:8px;direction:rtl}
#prog div{flex:1;background:rgba(255,255,255,.2);position:relative;overflow:hidden;border-radius:2px}
#prog div i{position:absolute;top:0;bottom:0;right:0;background:var(--red)}
#ticks{position:absolute;top:22px;left:0;right:0;height:14px;background-image:linear-gradient(90deg,rgba(255,255,255,.4) 2px,transparent 2px);background-size:40px 14px}
#brand{position:absolute;right:0;top:62px;text-align:right}
#brand .n{font-family:Heebo;font-weight:900;font-size:44px;letter-spacing:-.02em}
#brand .t{font-family:Almoni;font-size:30px;color:#cfe0e8;margin-top:4px}
#site{position:absolute;left:0;top:78px;font-family:Heebo;font-weight:700;font-size:32px;direction:ltr}
#counter{position:absolute;left:0;top:124px;font-family:Heebo;font-weight:700;font-size:26px;direction:ltr;color:var(--mist)}
#vignette{position:absolute;inset:0;z-index:14;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.28) 100%)}
svg{overflow:visible}
.ln{fill:none;stroke:#fff;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.thin{fill:none;stroke:rgba(255,255,255,.75);stroke-width:2.5}
.dash{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:18 12}
.tile{fill:rgba(255,255,255,.14);stroke:#fff;stroke-width:4}
.dot{fill:#a90b0c}
.tag{font-family:Heebo;font-weight:900;fill:#fff}
.tagl{font-family:Almoni;font-weight:700;fill:#dbe9f0}
</style>
</head>
<body>
<div id="stage">
  <div id="redbg"></div>
  <div class="grid"></div>
  <div id="scenes"></div>
  <div id="vignette"></div>
  <div id="header"><img id="logo" src="kurkoos-logo-h-white.svg"><div id="chip"><span id="chipt">פרט הנדסי</span><i></i></div></div>
  <div id="caps"><div id="capline"></div></div>
  <div id="endlogo"><img src="kurkoos-logo-h-white.svg" style="width:620px"><div class="lbl" style="font-size:46px;margin-top:22px">קבוצת קורקוס. מקרקע ועד מסירת מפתח.</div></div>
  <div id="bottom"><div id="prog"></div><div id="ticks"></div>
    <div id="brand"><div class="n">קבוצת קורקוס</div><div class="t">מקרקע ועד מסירת מפתח</div></div>
    <div id="site">kurkoos-group.co.il</div><div id="counter">01 / 09</div></div>
  <div class="crop" style="left:30px;top:30px;border-left-width:3px;border-top-width:3px"></div>
  <div class="crop" style="right:30px;top:30px;border-right-width:3px;border-top-width:3px"></div>
  <div class="crop" style="left:30px;bottom:30px;border-left-width:3px;border-bottom-width:3px"></div>
  <div class="crop" style="right:30px;bottom:30px;border-right-width:3px;border-bottom-width:3px"></div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
let TL,S={},VIS=[],VI={};

// ---------- drawings ----------
// floor/wall section. Wall face at x=220, tiles from x=242 (gap 22) or 220 (no gap).
const TW=118, TP=124;
function hatch(x,y,w,h,step=26){let s='';for(let k=-h;k<w;k+=step){const x1=Math.max(x,x+k),y1=y+(x+k<x?(x-(x+k)):0);s+=`<line x1="${x+k}" y1="${y+h}" x2="${x+k+h}" y2="${y}"/>`;}
  return `<g clip-path="inset(0)" ><clipPath id="c${x}_${y}_${w}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#c${x}_${y}_${w})" stroke="rgba(255,255,255,.55)" stroke-width="2.5">${s}</g></g>`;}
function section(id,gap=22,opts={}){
  const x0=220+gap, wt=opts.wallTop||300;
  let tiles='';for(let i=0;i<6;i++)tiles+=`<rect class="tile" data-i="${i}" x="${x0+i*TP}" y="${774}" width="${gap?TW:TW}" height="26" rx="2"/>`;
  return `<g id="${id}">
   ${hatch(140,800,840,60)}<rect class="ln" x="140" y="800" width="840" height="60"/>
   ${hatch(140,wt,80,800-wt)}<rect class="ln" x="140" y="${wt}" width="80" height="${800-wt}"/>
   <line class="thin" x1="220" y1="800" x2="980" y2="800"/>
   <g class="tiles">${tiles}</g>
  </g>`;}
function check(x,y,r=40,ok=true){return ok?`<g transform="translate(${x},${y})"><circle r="${r}" fill="#fff"/><path d="M${-r*.45} ${r*.02} L${-r*.1} ${r*.35} L${r*.5} ${-r*.35}" fill="none" stroke="#105572" stroke-width="${r*.22}" stroke-linecap="round" stroke-linejoin="round"/></g>`
 :`<g transform="translate(${x},${y})"><circle r="${r}" fill="#a90b0c"/><path d="M${-r*.38} ${-r*.38} L${r*.38} ${r*.38} M${r*.38} ${-r*.38} L${-r*.38} ${r*.38}" stroke="#fff" stroke-width="${r*.22}" stroke-linecap="round"/></g>`;}

function build(){
 $('#scenes').innerHTML=`
 <div class="scene" id="v-hook"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   <g id="hcam">${section('sec1',22)}
    <g id="gapmark" opacity="0"><path class="ln" d="M220 735 V715 M242 735 V715 M220 725 H242" stroke-width="4"/>
      <line class="thin" x1="231" y1="715" x2="330" y2="560"/><line class="thin" x1="330" y1="560" x2="520" y2="560"/>
      <text class="tag" x="520" y="540" font-size="54" text-anchor="start">רווח</text></g>
    <circle id="gdot" class="dot" cx="231" cy="787" r="0"/>
   </g></svg></div>

 <div class="scene" id="v-reason"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   <g id="rcam">${section('sec2',22)}<circle class="dot" cx="231" cy="787" r="9"/>
     <circle id="rring" cx="231" cy="787" r="40" fill="none" stroke="#a90b0c" stroke-width="5"/></g>
   <text id="qmark" class="tag" x="760" y="560" font-size="420" text-anchor="middle" opacity="0" fill="rgba(255,255,255,.9)">?</text>
 </svg></div>

 <div class="scene" id="v-title">
   <div style="position:absolute;right:80px;left:80px;top:250px;text-align:right">
     <div id="tt" class="h" style="font-size:132px">למה משאירים<br>רווח ליד הקיר?</div>
     <div id="tbar" style="width:0;height:14px;background:var(--red);margin:34px 0 0 auto"></div>
   </div>
   <div id="tlist" style="position:absolute;right:80px;left:80px;top:720px">
     ${[['01','רווח'],['02','תנועה'],['03','הסתרה']].map(([n,x])=>`<div class="ti" style="display:flex;gap:30px;align-items:baseline;border-top:3px dashed rgba(255,255,255,.35);padding:22px 0;opacity:0">
        <span class="h" style="font-size:64px;color:#ff6b6b">${n}</span><span class="h" style="font-size:64px">${x}</span></div>`).join('')}
   </div>
 </div>

 <div class="scene" id="v-gap"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   <g id="plan" transform="translate(-110,0)">
    <path id="pOuter" class="ln" d="M180 60 H780 V880 H180 Z" stroke-width="7" pathLength="1" stroke-dasharray="1 1"/>
    <g id="pGrid" stroke="rgba(255,255,255,.22)" stroke-width="2">${[...Array(6)].map((_,i)=>`<line x1="${222+i*120}" y1="102" x2="${222+i*120}" y2="838"/>`).join('')}${[...Array(7)].map((_,i)=>`<line x1="222" y1="${102+i*120}" x2="738" y2="${102+i*120}"/>`).join('')}</g>
    <rect id="pPer" class="dash" x="214" y="94" width="532" height="752" stroke="#fff"/>
    <path id="pJoint" d="M480 94 V846 M214 470 H746" fill="none" stroke="#ffb3b3" stroke-width="5" stroke-dasharray="18 12"/>
    <circle id="d1" class="dot" cx="746" cy="250" r="0"/><circle id="d2" class="dot" cx="480" cy="470" r="0"/>
    <g id="l1" opacity="0"><line class="thin" x1="746" y1="250" x2="880" y2="160"/><text class="tag" x="1070" y="140" font-size="46" text-anchor="start">רווח היקפי</text><text class="tagl" x="1070" y="190" font-size="32" text-anchor="start">בין הריצוף לקיר</text></g>
    <g id="l2" opacity="0"><line class="thin" x1="480" y1="470" x2="880" y2="600"/><text class="tag" x="1070" y="640" font-size="46" text-anchor="start">מישקים</text><text class="tagl" x="1070" y="690" font-size="32" text-anchor="start">במשטחים רחבים</text></g>
   </g></svg></div>

 <div class="scene" id="v-move"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   <g id="heat" opacity="0" transform="translate(860,40)">
     <circle r="34" fill="none" stroke="#ffd47a" stroke-width="6"/><g id="hrays" stroke="#ffd47a" stroke-width="6" stroke-linecap="round">${[...Array(8)].map((_,i)=>`<line x1="0" y1="-48" x2="0" y2="-62" transform="rotate(${i*45})"/>`).join('')}</g>
     <path d="M-120 -20 C-110 -2 -106 6 -106 12 A14 14 0 1 1 -134 12 C-134 6 -130 -2 -120 -20Z" fill="#8fd3f0"/>
     <path d="M-170 0 C-162 14 -159 20 -159 25 A11 11 0 1 1 -181 25 C-181 20 -178 14 -170 0Z" fill="#8fd3f0"/>
   </g>
   <g transform="translate(0,-420)"><g id="rowA">${section('secA',0,{wallTop:600})}</g>
     <text class="tag" x="980" y="690" font-size="48" text-anchor="start">בלי רווח</text><g id="xA" opacity="0">${check(560,680,34,false)}</g></g>
   <g transform="translate(0,-20)"><g id="rowB">${section('secB',22,{wallTop:600})}</g>
     <text class="tag" x="980" y="690" font-size="48" text-anchor="start">עם רווח</text><g id="okB" opacity="0">${check(560,680,34,true)}</g></g>
   <g id="arrows" opacity="0" stroke="#ffd47a" stroke-width="5" fill="none" stroke-linecap="round">
     ${[0,1].map(r=>[1,3,5].map(i=>{const y=(r?-20:-420)+760, x=242+i*124+59;return `<path d="M${x-30} ${y} H${x+30} M${x-30} ${y} l10 -8 M${x-30} ${y} l10 8 M${x+30} ${y} l-10 -8 M${x+30} ${y} l-10 8"/>`}).join('')).join('')}
   </g>
 </svg></div>

 <div class="scene" id="v-hide"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   <g id="hcam2">${section('sec3',22)}
     <rect id="ghost" x="220" y="774" width="22" height="26" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-dasharray="6 5"/>
     <g id="panel"><rect x="220" y="680" width="34" height="94" fill="#f7f8fa" stroke="#fff" stroke-width="3"/><rect x="220" y="680" width="34" height="8" fill="#dfe6ea"/></g>
     <g id="plbl" opacity="0"><line class="thin" x1="254" y1="720" x2="420" y2="560"/><line class="thin" x1="420" y1="560" x2="600" y2="560"/><text class="tag" x="600" y="540" font-size="54" text-anchor="start">פנל</text><text class="tagl" x="600" y="600" font-size="34" text-anchor="start">מסתיר את הרווח</text></g>
     <g id="eye" opacity="0" transform="translate(800,520)"><path d="M-70 0 C-35 -42 35 -42 70 0 C35 42 -35 42 -70 0Z" fill="none" stroke="#fff" stroke-width="6"/><circle r="16" fill="#fff"/><line x1="-80" y1="50" x2="80" y2="-50" stroke="#a90b0c" stroke-width="9" stroke-linecap="round"/></g>
   </g></svg></div>

 <div class="scene" id="v-future">
   <div id="fA" style="position:absolute;right:60px;left:60px;top:230px;height:430px;border:3px solid rgba(255,255,255,.5);border-radius:10px;padding:26px;opacity:0">
     <div class="h" style="font-size:58px">היום</div><div class="lbl" style="font-size:34px;color:#dbe9f0;margin-top:6px">נראה כמו פספוס?</div>
     <svg width="600" height="260" viewBox="120 630 560 250" style="position:absolute;left:20px;bottom:20px;overflow:hidden">${section('fsA',22,{wallTop:650})}<circle class="dot" cx="231" cy="787" r="10"/></svg>
   </div>
   <svg id="farrow" width="60" height="50" style="position:absolute;left:510px;top:668px;opacity:0"><path class="ln" d="M30 2 V44 M12 26 L30 46 L48 26"/></svg>
   <div id="fB" style="position:absolute;right:60px;left:60px;top:700px;height:430px;border:3px solid #fff;background:rgba(255,255,255,.08);border-radius:10px;padding:26px;opacity:0">
     <div class="h" style="font-size:58px">בעוד כמה שנים</div><div class="lbl" style="font-size:34px;color:#dbe9f0;margin-top:6px">רצפה שקטה</div>
     <svg width="600" height="260" viewBox="120 630 560 250" style="position:absolute;left:20px;bottom:20px;overflow:hidden">${section('fsB',22,{wallTop:650})}<rect x="220" y="700" width="34" height="74" fill="#f7f8fa" stroke="#fff" stroke-width="3"/></svg>
     <div id="fok" style="position:absolute;left:30px;top:30px;opacity:0"><svg width="80" height="80">${check(40,40,36,true)}</svg></div>
   </div>
   <div id="fline" class="lbl" style="position:absolute;right:70px;left:70px;top:830px;text-align:center;font-size:44px;opacity:0">מלאכה שכל כולה מחשבה על העתיד</div>
 </div>

 <div class="scene" id="v-smart">
   <svg width="200" height="160" style="position:absolute;right:90px;top:240px"><g id="qm" opacity="0"><path d="M150 10 L110 150 M80 10 L40 150" stroke="#a90b0c" stroke-width="22" stroke-linecap="square"/></g></svg>
   <svg width="1080" height="1000" style="position:absolute;left:0;top:240px"><g id="sm" opacity="1">${section('sec4',22)}
     <rect x="220" y="680" width="34" height="94" fill="#f7f8fa"/></g>
     <rect id="smgap" x="220" y="774" width="22" height="26" fill="#a90b0c" opacity="0"/></svg>
   <div id="vanish" class="h" style="position:absolute;left:80px;right:80px;top:420px;text-align:center;font-size:150px">להיעלם.</div>
 </div>

 <div class="scene" id="v-cta">
   <div style="position:absolute;right:80px;left:80px;top:230px">
     ${[['bm','שמרו'],['sh','שלחו למי שמרצף עכשיו'],['cm','כתבו בתגובות']].map(([k,x],i)=>`<div class="act" style="display:flex;align-items:center;gap:28px;padding:20px 0;border-bottom:3px dashed rgba(255,255,255,.35);opacity:0">
       <div style="width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none">${
        k==='bm'?'<svg width="44" height="58"><path d="M2 2 H42 V56 L22 40 L2 56 Z" fill="#a90b0c"/></svg>':
        k==='sh'?'<svg width="56" height="50"><path d="M4 26 L52 4 L36 46 L28 30 Z" fill="#a90b0c"/></svg>':
        '<svg width="56" height="52"><path d="M6 6 H50 V36 H22 L10 48 V36 H6 Z" fill="#a90b0c"/></svg>'}</div>
       <div class="h" style="font-size:62px">${x}</div></div>`).join('')}
     <div id="bubble" style="margin:30px 120px 0 0;display:inline-block;background:#fff;color:#07293a;border-radius:28px 28px 28px 6px;padding:18px 40px;font-family:Heebo;font-weight:900;font-size:72px;opacity:0"><span id="typed"></span><span id="caret" style="color:#a90b0c">|</span></div>
   </div>
   <div id="qrrow" style="position:absolute;right:80px;left:80px;top:830px;display:flex;align-items:center;gap:40px;opacity:0;direction:rtl">
     <div style="background:#fff;border-radius:14px;padding:14px;flex:none"><img src="qr.png" style="width:240px;height:240px;display:block"></div>
     <div><div style="font-family:Heebo;font-weight:900;font-size:44px;direction:ltr;text-align:right">kurkoos-group.co.il/execution</div>
       <div style="font-family:Heebo;font-weight:900;font-size:58px;direction:ltr;text-align:right;margin-top:14px">055-981-1814</div></div>
   </div>
 </div>`;
 $('#prog').innerHTML=VIS.map(()=>'<div><i></i></div>').join('');
}

const CHIP={hook:'פרט הנדסי',reason:'פרט הנדסי',title:'פרט הנדסי',gap:'01 רווח',move:'02 תנועה',hide:'03 הסתרה',future:'מחשבה על העתיד',smart:'מחשבה על העתיד',cta:'קבוצת קורקוס'};
function setup(tl){TL=tl; tl.scenes.forEach(s=>S[s.id]=s);
 VIS=tl.scenes.map((s,i)=>({id:s.id,a:i?s.start-0.75:0,b:i<tl.scenes.length-1?tl.scenes[i+1].start-0.75:tl.total}));
 VIS.forEach(v=>VI[v.id]=v); build();}
const w=(sid,i)=>S[sid].words[i<0?S[sid].words.length+i:i].s;
const on=id=>{const v=VI[id];return TT>v.a-0.2&&TT<v.b+0.5;};
let TT=0;

function render(t){ TT=t;
 let cur=0;
 VIS.forEach((v,i)=>{const el=$('#v-'+v.id);
  const inn=i===0?1:eo(seg(t,v.a-0.05,v.a+0.5)), out=i===VIS.length-1?0:seg(t,v.b-0.1,v.b+0.35);
  const vis=t>=v.a-0.05&&t<v.b+0.35; el.style.display=vis?'block':'none'; if(!vis)return;
  if(t>=v.a)cur=i; el.style.opacity=Math.min(inn,1-out);
  el.style.transform=`translateY(${(1-inn)*60-out*40}px) scale(${1+out*0.03})`;});
 const V=VIS[cur];
 $('#chipt').textContent=CHIP[V.id];
