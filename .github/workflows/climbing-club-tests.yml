name: climbing-club tests
on:
  push:
    paths: ["climbing-club/**", ".github/workflows/climbing-club-tests.yml"]
  pull_request:
    paths: ["climbing-club/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: climbing-club
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: climbing-club/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
