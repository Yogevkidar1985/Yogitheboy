<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>כניסה · ניהול החוג</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth-body">
<div class="auth-card">
  <h1>ניהול חוג טיפוס</h1>
  <p class="muted">כניסה למערכת</p>
  {% for f in flash_messages %}<div class="flash flash-{{ f.kind }}">{{ f.text }}</div>{% endfor %}
  <form method="post" action="/login" class="form">
    <label>שם משתמש<input name="username" required autofocus autocomplete="username"></label>
    <label>סיסמה<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block">כניסה</button>
  </form>
</div></body></html>
