<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Kurkoos tenth winter video</title>
<style>
@font-face{font-family:Heebo;font-weight:900;src:url(heebo-hebrew-900-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:900;src:url(heebo-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:Heebo;font-weight:700;src:url(heebo-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:700;src:url(heebo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Almoni;font-weight:400;src:url(almoni-400.woff2) format('woff2')}
@font-face{font-family:Almoni;font-weight:700;src:url(almoni-700.woff2) format('woff2')}
:root{--night:#07293a;--teal:#105572;--bp:#13506c;--mist:#8fb6c8;--paper:#f7f8fa;--red:#a90b0c;--gold:#ffd47a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bp)}
body{font-family:Almoni,Heebo,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#a9d0e0 0%,#96c3d6 38%,#5d8ea8 62%,#1f4560 82%,#14334a 100%)}
#redbg{position:absolute;inset:0;background:var(--red);opacity:0}
.grid{position:absolute;inset:0;background-image:
 linear-gradient(rgba(23,56,79,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(23,56,79,.10) 2px,transparent 2px),
 linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
 background-size:300px 300px,300px 300px,60px 60px,60px 60px;background-position:-1px -1px}
.h{font-family:Heebo;font-weight:900;letter-spacing:-.02em;line-height:1.04}
.lbl{font-family:Almoni;font-weight:700}
.crop{position:absolute;width:44px;height:44px;border-color:rgba(255,255,255,.55);border-style:solid;border-width:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;display:none}
#header{position:absolute;top:0;left:0;right:0;height:200px;z-index:20}
#logo{position:absolute;left:70px;top:78px;width:300px}
#chip{position:absolute;right:70px;top:84px;color:#17384f;font-family:Almoni;font-weight:700;font-size:36px;padding:10px 0 8px;white-space:nowrap;display:flex;align-items:center;gap:16px}
#chip i{display:inline-block;width:22px;height:22px;background:var(--red)}
#caps{position:absolute;left:60px;right:60px;top:1215px;height:420px;z-index:15;display:flex;align-items:center;justify-content:center;text-align:center}
#capline{font-family:Heebo;font-weight:900;font-size:74px;line-height:1.22;letter-spacing:-.01em;text-shadow:0 4px 18px rgba(0,0,0,.3)}
#capline span{display:inline-block;padding:0 12px;margin:2px 0;border-radius:12px;transform-origin:50% 60%}
#endlogo{position:absolute;left:0;right:0;top:1250px;text-align:center;opacity:0;z-index:16}
#bottom{position:absolute;left:70px;right:70px;top:1680px;height:200px;z-index:20}
#prog{position:absolute;top:0;left:0;right:0;height:10px;display:flex;gap:8px;direction:rtl}
#prog div{flex:1;background:rgba(255,255,255,.2);position:relative;overflow:hidden;border-radius:2px}
#prog div i{position:absolute;top:0;bottom:0;right:0;background:var(--red)}
#ticks{position:absolute;top:22px;left:0;right:0;height:14px;background-image:linear-gradient(90deg,rgba(255,255,255,.4) 2px,transparent 2px);background-size:40px 14px}
#brand{position:absolute;right:0;top:62px;text-align:right}
#brand .n{font-family:Heebo;font-weight:900;font-size:44px;letter-spacing:-.02em}
#brand .t{font-family:Almoni;font-size:30px;color:#cfe0e8;margin-top:4px}
#site{position:absolute;left:0;top:78px;font-family:Heebo;font-weight:700;font-size:32px;direction:ltr}
#counter{position:absolute;left:0;top:124px;font-family:Heebo;font-weight:700;font-size:26px;direction:ltr;color:var(--mist)}
#vignette{position:absolute;inset:0;z-index:14;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.28) 100%)}
svg{overflow:visible}
.ln{fill:none;stroke:#fff;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.thin{fill:none;stroke:rgba(255,255,255,.75);stroke-width:2.5}
.dash{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:18 12}
.tile{fill:rgba(255,255,255,.14);stroke:#fff;stroke-width:4}
.dot{fill:#a90b0c}
.tag{font-family:Heebo;font-weight:900;fill:#fff}
.tagl{font-family:Almoni;font-weight:700;fill:#dbe9f0}
</style>
</head>
<body>
<div id="stage">
  <div id="redbg"></div>
  <div class="grid"></div>
  <div id="scenes"></div>
  <div id="vignette"></div>
  <div id="header"><img id="logo" src="kurkoos-logo-h.svg"><div id="chip"><span id="chipt">פרטים קטנים</span><i></i></div></div>
  <div id="caps"><div id="capline"></div></div>
  <div id="endlogo"><img src="kurkoos-logo-h-white.svg" style="width:620px"><div class="lbl" style="font-size:46px;margin-top:22px">קבוצת קורקוס. מקרקע ועד מסירת מפתח.</div></div>
  <div id="bottom"><div id="prog"></div><div id="ticks"></div>
    <div id="brand"><div class="n">קבוצת קורקוס</div><div class="t">מקרקע ועד מסירת מפתח</div></div>
    <div id="site">kurkoos-group.co.il</div><div id="counter">01 / 12</div></div>
  <div class="crop" style="left:30px;top:30px;border-left-width:3px;border-top-width:3px"></div>
  <div class="crop" style="right:30px;top:30px;border-right-width:3px;border-top-width:3px"></div>
  <div class="crop" style="left:30px;bottom:30px;border-left-width:3px;border-bottom-width:3px"></div>
  <div class="crop" style="right:30px;bottom:30px;border-right-width:3px;border-bottom-width:3px"></div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const e5=x=>1-Math.pow(1-x,5);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
let TL,S={},VIS=[],VI={};

// ---------- drawings ----------
// floor/wall section. Wall face at x=220, tiles from x=242 (gap 22) or 220 (no gap).
const TW=118, TP=124;
function hatch(x,y,w,h,step=26){let s='';for(let k=-h;k<w;k+=step){const x1=Math.max(x,x+k),y1=y+(x+k<x?(x-(x+k)):0);s+=`<line x1="${x+k}" y1="${y+h}" x2="${x+k+h}" y2="${y}"/>`;}
  return `<g clip-path="inset(0)" ><clipPath id="c${x}_${y}_${w}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#c${x}_${y}_${w})" stroke="rgba(255,255,255,.55)" stroke-width="2.5">${s}</g></g>`;}
function section(id,gap=22,opts={}){
  const x0=220+gap, wt=opts.wallTop||300;
  let tiles='';for(let i=0;i<6;i++)tiles+=`<rect class="tile" data-i="${i}" x="${x0+i*TP}" y="${774}" width="${gap?TW:TW}" height="26" rx="2"/>`;
  return `<g id="${id}">
   ${hatch(140,800,840,60)}<rect class="ln" x="140" y="800" width="840" height="60"/>
   ${hatch(140,wt,80,800-wt)}<rect class="ln" x="140" y="${wt}" width="80" height="${800-wt}"/>
   <line class="thin" x1="220" y1="800" x2="980" y2="800"/>
   <g class="tiles">${tiles}</g>
  </g>`;}
function check(x,y,r=40,ok=true){return ok?`<g transform="translate(${x},${y})"><circle r="${r}" fill="#fff"/><path d="M${-r*.45} ${r*.02} L${-r*.1} ${r*.35} L${r*.5} ${-r*.35}" fill="none" stroke="#105572" stroke-width="${r*.22}" stroke-linecap="round" stroke-linejoin="round"/></g>`
 :`<g transform="translate(${x},${y})"><circle r="${r}" fill="#a90b0c"/><path d="M${-r*.38} ${-r*.38} L${r*.38} ${r*.38} M${r*.38} ${-r*.38} L${-r*.38} ${r*.38}" stroke="#fff" stroke-width="${r*.22}" stroke-linecap="round"/></g>`;}

const NV='#17384f';
function P(x,y,z,o){const c=0.866,s=0.5;return [o.cx+(x-y)*c*o.s, o.cy+(x+y)*s*o.s-z*o.s];}
function poly(pts,o,attrs){return `<polygon points="${pts.map(p=>P(...p,o).map(v=>v.toFixed(1)).join(',')).join(' ')}" ${attrs}/>`;}
function house(id,o){const H=3.2,W=10,D=8;let s=`<g id="${id}">`;
 s+=poly([[-2,-2,0],[12,-2,0],[12,10,0],[-2,10,0]],o,`fill="rgba(255,255,255,.18)" stroke="${NV}" stroke-width="3"`);
 s+=poly([[0,D,0],[W,D,0],[W,D,H],[0,D,H]],o,`class="fl" fill="#7fa9bd" stroke="${NV}" stroke-width="4"`);
 s+=poly([[W,0,0],[W,D,0],[W,D,H],[W,0,H]],o,`class="fr" fill="#5e8aa1" stroke="${NV}" stroke-width="4"`);
 s+=poly([[0,0,H],[W,0,H],[W,D,H],[0,D,H]],o,`class="roof" fill="#a7cbdb" stroke="${NV}" stroke-width="4"`);
 s+=poly([[0.5,0.5,H],[W-0.5,0.5,H],[W-0.5,D-0.5,H],[0.5,D-0.5,H]],o,`fill="none" stroke="${NV}" stroke-width="2.5" opacity=".7"`);
 [[1.2,2.8],[4.2,5.8],[7.2,8.8]].forEach(([a,b])=>s+=poly([[a,D,0.9],[b,D,0.9],[b,D,2.4],[a,D,2.4]],o,`fill="#2c5872" stroke="${NV}" stroke-width="3"`));
 [[2,3.6],[5,6.6]].forEach(([a,b])=>s+=poly([[W,a,0.9],[W,b,0.9],[W,b,2.4],[W,a,2.4]],o,`fill="#2c5872" stroke="${NV}" stroke-width="3"`));
 s+=poly([[6,2.5,H],[8,2.5,H],[8,4.5,H],[6,4.5,H]],o,`fill="#a7cbdb" stroke="${NV}" stroke-width="3"`);
 s+=poly([[8,2.5,H],[8,4.5,H],[8,4.5,H+0.6],[8,2.5,H+0.6]],o,`fill="#5e8aa1" stroke="${NV}" stroke-width="3"`);
 s+=poly([[6,4.5,H],[8,4.5,H],[8,4.5,H+0.6],[6,4.5,H+0.6]],o,`fill="#7fa9bd" stroke="${NV}" stroke-width="3"`);
 s+=poly([[6,2.5,H+0.6],[8,2.5,H+0.6],[8,4.5,H+0.6],[6,4.5,H+0.6]],o,`fill="#c4dde8" stroke="${NV}" stroke-width="3"`);
 [[2,2],[3,6.5]].forEach(([x,y])=>{const [a,b]=P(x,y,H,o);s+=`<ellipse cx="${a}" cy="${b}" rx="${o.s*0.55}" ry="${o.s*0.3}" fill="#2c5872" stroke="${NV}" stroke-width="3"/>`;});
 return s+'</g>';}
const SPK=(x,y,r)=>`<path class="spk" d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="#fff"/>`;
function rain(n,id){let s=`<g id="${id}" stroke="#e8f3f8" stroke-width="4" stroke-linecap="round" opacity="0">`;for(let i=0;i<n;i++)s+=`<line x1="0" y1="0" x2="-34" y2="56"/>`;return s+'</g>';}
function updRain(id,t,amt,sp=1600){const g=document.getElementById(id);if(!g)return;g.setAttribute('opacity',amt);[...g.children].forEach((l,i)=>{const x=(i*137.3)%1300-60,v=sp+(i%7)*90,y=((t*v+i*233)%1150)-120;l.setAttribute('transform',`translate(${x+y*0.62},${y})`);});}
const card=(inner,lbl)=>`<div class="ic" style="width:280px;height:330px;background:rgba(255,255,255,.92);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;opacity:0;box-shadow:0 20px 50px rgba(23,56,79,.25)">${inner}<div style="font-family:Heebo;font-weight:900;font-size:40px;color:${NV}">${lbl}</div></div>`;
function build(){
 const HO={cx:540,cy:300,s:40}, HS={cx:540,cy:420,s:30};
 $('#scenes').innerHTML=`<svg width="0" height="0" style="position:absolute"><defs><pattern id="hat" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="22" stroke="${NV}" stroke-width="3" opacity=".55"/></pattern></defs></svg>
 <div class="scene" id="v-hook"><svg width="1080" height="1000" style="position:absolute;left:0;top:200px">${house('h1',HO)}
   <g id="spk1">${SPK(250,250,26)}${SPK(840,180,34)}${SPK(790,560,22)}${SPK(330,620,30)}${SPK(560,120,20)}</g></svg>
   <div id="hchip" style="position:absolute;right:80px;top:1030px;display:flex;align-items:center;gap:18px;background:#fff;color:${NV};padding:16px 32px;border-radius:50px;font-family:Heebo;font-weight:900;font-size:44px;opacity:0">
     <svg width="56" height="40" viewBox="0 0 56 40"><circle cx="14" cy="20" r="11" fill="none" stroke="#a90b0c" stroke-width="6"/><path d="M25 20 H52 M44 20 V30 M36 20 V27" stroke="#a90b0c" stroke-width="6" stroke-linecap="round"/></svg>יום המסירה</div></div>

 <div class="scene" id="v-shine"><div style="position:absolute;left:60px;right:60px;top:380px;display:flex;justify-content:space-between;direction:rtl">
   ${card(`<svg width="150" height="130" viewBox="0 0 150 130"><rect x="10" y="10" width="110" height="44" rx="12" fill="${NV}"/><path d="M120 32 H138 V70 H70 V92" fill="none" stroke="${NV}" stroke-width="8"/><rect x="60" y="92" width="20" height="36" rx="6" fill="#a90b0c"/></svg>`,'צבע טרי')}
   ${card(`<svg width="150" height="130" viewBox="0 0 150 130"><path d="M10 70 L75 35 L140 70 L75 105Z" fill="#c4dde8" stroke="${NV}" stroke-width="6"/><path d="M42 52 L108 88 M42 88 L108 52" stroke="${NV}" stroke-width="4"/></svg>`,'רצפה נקייה')}
   ${card(`<svg width="150" height="130" viewBox="0 0 150 130"><path d="M40 30 H100 V48 H118 V78 H100 V60 H58 V48 H40Z" fill="${NV}"/><rect x="62" y="12" width="16" height="20" fill="${NV}"/><rect x="45" y="6" width="50" height="10" rx="5" fill="${NV}"/><path d="M109 86 C104 96 102 100 102 104 A7 7 0 1 0 116 104 C116 100 114 96 109 86Z" fill="#6aa8c9"/></svg>`,'ברזים מבריקים')}
 </div>${''}</div>

 <div class="scene" id="v-test">
   <svg width="1080" height="600" style="position:absolute;left:0;top:200px">${house('h2',{cx:540,cy:180,s:22})}</svg>
   <div style="position:absolute;left:0;right:0;top:620px;text-align:center">
     <div class="lbl" style="font-size:44px;color:${NV};letter-spacing:.06em">שנה</div>
     <div id="yr" class="h" style="font-size:300px;color:#fff;text-shadow:0 10px 40px rgba(23,56,79,.35)">0</div></div>
 </div>

 <div class="scene" id="v-weather"><svg width="1080" height="1000" style="position:absolute;left:0;top:200px">
   <g id="sun" opacity="0" transform="translate(800,90)"><circle r="62" fill="#ffd47a"/><g id="srays" stroke="#ffd47a" stroke-width="10" stroke-linecap="round">${[...Array(10)].map((_,i)=>`<line x1="0" y1="-88" x2="0" y2="-112" transform="rotate(${i*36})"/>`).join('')}</g></g>
   ${house('h3',HO)}
   <g id="heat" opacity="0" stroke="#e2793f" stroke-width="6" fill="none" stroke-linecap="round">${[0,1,2,3].map(i=>`<path class="hw" d="M${400+i*90} 230 c-14 -20 14 -36 0 -56 c-14 -20 14 -36 0 -56"/>`).join('')}</g>
   ${rain(70,'wrain')}
   <g id="wlbl1" opacity="0"><rect x="70" y="40" width="300" height="76" rx="38" fill="#fff"/><text x="220" y="92" text-anchor="middle" font-family="Heebo" font-weight="900" font-size="40" fill="${NV}">גשם מהצד</text></g>
   <g id="wlbl2" opacity="0"><rect x="70" y="140" width="300" height="76" rx="38" fill="#fff"/><text x="220" y="192" text-anchor="middle" font-family="Heebo" font-weight="900" font-size="40" fill="#c4572a">קיץ על הגג</text></g>
 </svg></div>

 <div class="scene" id="v-three">
   <div style="position:absolute;right:80px;left:80px;top:250px;display:flex;align-items:center;gap:34px">
     <div id="t3" class="h" style="font-size:330px;color:#fff;line-height:.85;text-shadow:0 10px 40px rgba(23,56,79,.3)">3</div>
     <div><div id="t3a" class="h" style="font-size:96px;color:${NV}">פרטים<br>קטנים</div>
       <div id="t3b" style="display:inline-block;margin-top:20px;background:#a90b0c;color:#fff;font-family:Heebo;font-weight:900;font-size:40px;padding:10px 26px;border-radius:8px">נבדקים לעשר שנים</div></div></div>
   <div style="position:absolute;right:80px;left:80px;top:720px">
     ${[['01','אף מים'],['02','שיפועים'],['03','חדירות']].map(([n,x])=>`<div class="tl" style="display:flex;gap:30px;align-items:baseline;border-top:3px solid rgba(23,56,79,.35);padding:18px 0;opacity:0"><span class="h" style="font-size:60px;color:#a90b0c">${n}</span><span class="h" style="font-size:64px;color:#fff">${x}</span></div>`).join('')}</div>
 </div>

 <div class="scene" id="v-d1"><svg width="1080" height="1000" style="position:absolute;left:0;top:200px">
   
   <rect x="700" y="60" width="150" height="860" fill="url(#hat)" stroke="${NV}" stroke-width="5"/>
   <rect x="700" y="60" width="150" height="860" fill="rgba(255,255,255,.2)"/>
   <path id="sill" d="M700 380 L330 400 L330 452 L700 452 Z" fill="#e9f2f6" stroke="${NV}" stroke-width="5"/>
   <path id="groove" d="M372 452 a14 14 0 0 0 28 0" fill="#9fc8da" stroke="#a90b0c" stroke-width="5" opacity="0"/>
   <circle id="gring" cx="386" cy="456" r="46" fill="none" stroke="#a90b0c" stroke-width="5" stroke-dasharray="12 8" opacity="0"/>
   <path id="badpath" d="M340 462 L690 462" fill="none" stroke="#a90b0c" stroke-width="4" stroke-dasharray="10 8" opacity="0"/>
   <ellipse id="stain" cx="700" cy="520" rx="0" ry="0" fill="#5b4a33" opacity=".45"/>
   <path id="drop1" d="M0 -16 C8 -4 11 3 11 8 A11 11 0 1 1 -11 8 C-11 3 -8 -4 0 -16Z" fill="#2f86c8" opacity="0"/>
   <path id="drop2" d="M0 -16 C8 -4 11 3 11 8 A11 11 0 1 1 -11 8 C-11 3 -8 -4 0 -16Z" fill="#a90b0c" opacity="0"/>
   <g id="okd1" opacity="0">${check(250,780,40,true)}<text x="305" y="795" font-family="Heebo" font-weight="900" font-size="44" fill="${NV}" text-anchor="end">הטיפה נופלת</text></g>
   <g id="xd1" opacity="0">${check(640,600,34,false)}<text x="590" y="613" font-family="Heebo" font-weight="900" font-size="40" fill="#a90b0c" text-anchor="start">בלי חריץ: זוחלת לקיר</text></g>
   <text x="330" y="360" font-family="Heebo" font-weight="900" font-size="44" fill="${NV}">אדן</text>
 </svg></div>

 <div class="scene" id="v-d2"><svg width="1080" height="1000" style="position:absolute;left:0;top:200px">
   <rect x="790" y="120" width="140" height="760" fill="url(#hat)" stroke="${NV}" stroke-width="5"/>
   <g id="slab"><rect x="150" y="560" width="640" height="60" fill="#e9f2f6" stroke="${NV}" stroke-width="5"/></g>
   <g id="drain" transform="translate(180,560)"><path d="M-30 0 H30 L14 46 H-14Z" fill="${NV}"/><rect x="-14" y="46" width="28" height="200" fill="${NV}"/></g>
   <g id="wdrops">${[...Array(9)].map(()=>`<ellipse rx="12" ry="7" fill="#2f86c8"/>`).join('')}</g>
   <g id="sarrow" opacity="0"><path d="M720 500 L260 500" stroke="#a90b0c" stroke-width="8" fill="none"/><path d="M290 480 L256 500 L290 520" stroke="#a90b0c" stroke-width="8" fill="none" stroke-linejoin="round"/>
     <text x="490" y="470" text-anchor="middle" font-family="Heebo" font-weight="900" font-size="46" fill="${NV}">אל הניקוז</text></g>
   <g id="tags2">${['מרפסת','גג','חצר'].map((x,i)=>`<g class="tg2" opacity="0"><rect x="${160+i*220}" y="170" width="190" height="80" rx="40" fill="#fff"/><text x="${255+i*220}" y="224" text-anchor="middle" font-family="Heebo" font-weight="900" font-size="42" fill="${NV}">${x}</text></g>`).join('')}</g>
