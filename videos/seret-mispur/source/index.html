<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Kurkoos tape method video</title>
<style>
@font-face{font-family:Heebo;font-weight:900;src:url(heebo-hebrew-900-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:900;src:url(heebo-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:Heebo;font-weight:700;src:url(heebo-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:700;src:url(heebo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Almoni;font-weight:400;src:url(almoni-400.woff2) format('woff2')}
@font-face{font-family:Almoni;font-weight:700;src:url(almoni-700.woff2) format('woff2')}
:root{--night:#07293a;--teal:#105572;--bp:#13506c;--mist:#8fb6c8;--paper:#f7f8fa;--red:#a90b0c;--gold:#ffd47a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bp)}
body{font-family:Almoni,Heebo,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#0c3a50 0%,#07293a 60%,#051d29 100%)}
#redbg{position:absolute;inset:0;background:var(--red);opacity:0}
.grid{position:absolute;inset:0;background-image:
 linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px),
 linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
 background-size:300px 300px,300px 300px,60px 60px,60px 60px;background-position:-1px -1px}
.h{font-family:Heebo;font-weight:900;letter-spacing:-.02em;line-height:1.04}
.lbl{font-family:Almoni;font-weight:700}
.crop{position:absolute;width:44px;height:44px;border-color:rgba(255,255,255,.55);border-style:solid;border-width:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;display:none}
#header{position:absolute;top:0;left:0;right:0;height:200px;z-index:20}
#logo{position:absolute;left:70px;top:78px;width:300px}
#chip{position:absolute;right:70px;top:84px;color:#fff;font-family:Almoni;font-weight:700;font-size:36px;padding:10px 0 8px;white-space:nowrap;display:flex;align-items:center;gap:16px}
#chip i{display:inline-block;width:22px;height:22px;background:var(--red)}
#caps{position:absolute;left:60px;right:60px;top:1215px;height:420px;z-index:15;display:flex;align-items:center;justify-content:center;text-align:center}
#capline{font-family:Heebo;font-weight:900;font-size:74px;line-height:1.22;letter-spacing:-.01em;text-shadow:0 4px 18px rgba(0,0,0,.3)}
#capline span{display:inline-block;padding:0 12px;margin:2px 0;border-radius:12px;transform-origin:50% 60%}
#endlogo{position:absolute;left:0;right:0;top:1250px;text-align:center;opacity:0;z-index:16}
#bottom{position:absolute;left:70px;right:70px;top:1680px;height:200px;z-index:20}
#prog{position:absolute;top:0;left:0;right:0;height:10px;display:flex;gap:8px;direction:rtl}
#prog div{flex:1;background:rgba(255,255,255,.2);position:relative;overflow:hidden;border-radius:2px}
#prog div i{position:absolute;top:0;bottom:0;right:0;background:var(--red)}
#ticks{position:absolute;top:22px;left:0;right:0;height:14px;background-image:linear-gradient(90deg,rgba(255,255,255,.4) 2px,transparent 2px);background-size:40px 14px}
#brand{position:absolute;right:0;top:62px;text-align:right}
#brand .n{font-family:Heebo;font-weight:900;font-size:44px;letter-spacing:-.02em}
#brand .t{font-family:Almoni;font-size:30px;color:#cfe0e8;margin-top:4px}
#site{position:absolute;left:0;top:78px;font-family:Heebo;font-weight:700;font-size:32px;direction:ltr}
#counter{position:absolute;left:0;top:124px;font-family:Heebo;font-weight:700;font-size:26px;direction:ltr;color:var(--mist)}
#vignette{position:absolute;inset:0;z-index:14;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.28) 100%)}
svg{overflow:visible}
.ln{fill:none;stroke:#fff;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.thin{fill:none;stroke:rgba(255,255,255,.75);stroke-width:2.5}
.dash{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:18 12}
.tile{fill:rgba(255,255,255,.14);stroke:#fff;stroke-width:4}
.dot{fill:#a90b0c}
.tag{font-family:Heebo;font-weight:900;fill:#fff}
.tagl{font-family:Almoni;font-weight:700;fill:#dbe9f0}
</style>
</head>
<body>
<div id="stage">
  <div id="redbg"></div>
  <div class="grid"></div>
  <div id="scenes"></div>
  <div id="vignette"></div>
  <div id="header"><img id="logo" src="kurkoos-logo-h-white.svg"><div id="chip"><span id="chipt">מסירת מפתח</span><i></i></div></div>
  <div id="caps"><div id="capline"></div></div>
  <div id="endlogo"><img src="kurkoos-logo-h-white.svg" style="width:620px"><div class="lbl" style="font-size:46px;margin-top:22px">קבוצת קורקוס. מקרקע ועד מסירת מפתח.</div></div>
  <div id="bottom"><div id="prog"></div><div id="ticks"></div>
    <div id="brand"><div class="n">קבוצת קורקוס</div><div class="t">מקרקע ועד מסירת מפתח</div></div>
    <div id="site">kurkoos-group.co.il</div><div id="counter">01 / 10</div></div>
  <div class="crop" style="left:30px;top:30px;border-left-width:3px;border-top-width:3px"></div>
  <div class="crop" style="right:30px;top:30px;border-right-width:3px;border-top-width:3px"></div>
  <div class="crop" style="left:30px;bottom:30px;border-left-width:3px;border-bottom-width:3px"></div>
  <div class="crop" style="right:30px;bottom:30px;border-right-width:3px;border-bottom-width:3px"></div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
let TL,S={},VIS=[],VI={};

// ---------- drawings ----------
// floor/wall section. Wall face at x=220, tiles from x=242 (gap 22) or 220 (no gap).
const TW=118, TP=124;
function hatch(x,y,w,h,step=26){let s='';for(let k=-h;k<w;k+=step){const x1=Math.max(x,x+k),y1=y+(x+k<x?(x-(x+k)):0);s+=`<line x1="${x+k}" y1="${y+h}" x2="${x+k+h}" y2="${y}"/>`;}
  return `<g clip-path="inset(0)" ><clipPath id="c${x}_${y}_${w}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#c${x}_${y}_${w})" stroke="rgba(255,255,255,.55)" stroke-width="2.5">${s}</g></g>`;}
function section(id,gap=22,opts={}){
  const x0=220+gap, wt=opts.wallTop||300;
  let tiles='';for(let i=0;i<6;i++)tiles+=`<rect class="tile" data-i="${i}" x="${x0+i*TP}" y="${774}" width="${gap?TW:TW}" height="26" rx="2"/>`;
  return `<g id="${id}">
   ${hatch(140,800,840,60)}<rect class="ln" x="140" y="800" width="840" height="60"/>
   ${hatch(140,wt,80,800-wt)}<rect class="ln" x="140" y="${wt}" width="80" height="${800-wt}"/>
   <line class="thin" x1="220" y1="800" x2="980" y2="800"/>
   <g class="tiles">${tiles}</g>
  </g>`;}
function check(x,y,r=40,ok=true){return ok?`<g transform="translate(${x},${y})"><circle r="${r}" fill="#fff"/><path d="M${-r*.45} ${r*.02} L${-r*.1} ${r*.35} L${r*.5} ${-r*.35}" fill="none" stroke="#105572" stroke-width="${r*.22}" stroke-linecap="round" stroke-linejoin="round"/></g>`
 :`<g transform="translate(${x},${y})"><circle r="${r}" fill="#a90b0c"/><path d="M${-r*.38} ${-r*.38} L${r*.38} ${r*.38} M${r*.38} ${-r*.38} L${-r*.38} ${r*.38}" stroke="#fff" stroke-width="${r*.22}" stroke-linecap="round"/></g>`;}

function thumbs(n,cols,x0,y0,w,h,gap){let s='';for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols),x=x0+c*(w+gap),y=y0+r*(h+gap),k=i%4;
  const glyph=k===0?`<path d="M${x+w*.5} ${y+h*.15} l-${w*.12} ${h*.25} l${w*.15} ${h*.15} l-${w*.1} ${h*.3}" stroke="#07293a" stroke-width="4" fill="none"/>`
   :k===1?`<path d="M${x+w*.2} ${y+h*.8} V${y+h*.25} H${x+w*.8}" stroke="#07293a" stroke-width="4" fill="none"/>`
   :k===2?`<rect x="${x+w*.28}" y="${y+h*.22}" width="${w*.44}" height="${h*.5}" stroke="#07293a" stroke-width="4" fill="none"/>`
   :`<circle cx="${x+w*.5}" cy="${y+h*.5}" r="${w*.16}" fill="#8a7552" opacity=".6"/>`;
  s+=`<g class="th" data-i="${i}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${['#dfe7ec','#cfdae1','#e8edf0','#d6e0e6'][k]}"/>${glyph}</g>`;}return s;}
function phone(){return `<rect x="600" y="40" width="360" height="720" rx="44" fill="#0b3448" stroke="#fff" stroke-width="6"/><rect x="740" y="62" width="80" height="14" rx="7" fill="#fff" opacity=".5"/>`;}
function clip(rows=7){let s=`<rect x="120" y="90" width="420" height="640" rx="18" fill="#f7f8fa"/><rect x="250" y="70" width="160" height="50" rx="12" fill="#8fb6c8"/>`;
  for(let i=0;i<rows;i++)s+=`<g class="row" data-i="${i}"><rect x="160" y="${160+i*78}" width="34" height="34" rx="6" fill="none" stroke="#07293a" stroke-width="4"/><rect x="214" y="${168+i*78}" width="${180+((i*53)%120)}" height="18" rx="9" fill="#9fb3bf"/></g>`;return s;}
function tape(x,y,w=170,h=52,rot=-4,id=''){return `<g ${id?`id="${id}"`:''} transform="translate(${x},${y}) rotate(${rot})"><path d="M0 0 H${w} l-8 ${h/4} l8 ${h/4} l-8 ${h/4} l8 ${h/4} H0 l8 -${h/4} l-8 -${h/4} l8 -${h/4} Z" fill="#c8191b"/><path d="M0 0 H${w}" stroke="#e8494a" stroke-width="5"/></g>`;}
function wall(){return `<rect x="110" y="40" width="860" height="700" fill="#e9eef2"/><rect x="110" y="40" width="860" height="700" fill="none" stroke="#fff" stroke-width="5"/>
  <path d="M110 640 H970" stroke="#cfd7de" stroke-width="3"/>
  <path class="crack" d="M520 170 L500 250 L540 300 L490 380 L520 430 L480 520" fill="none" stroke="#3d4b55" stroke-width="7" stroke-linejoin="round"/>
  <path d="M540 300 L590 320 L610 370" fill="none" stroke="#3d4b55" stroke-width="5"/>`;}
function build(){
 $('#scenes').innerHTML=`
 <div class="scene" id="v-hook"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   ${phone()}<g id="hthumbs">${thumbs(15,3,630,110,92,92,12)}</g>
   <g id="hclip">${clip()}</g>
   <g id="hcount" opacity="0"><rect x="640" y="660" width="280" height="70" rx="35" fill="#a90b0c"/><text class="tag" x="780" y="708" font-size="38" text-anchor="middle">עשרות תמונות</text></g>
 </svg></div>

 <div class="scene" id="v-mess"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   ${phone()}<g id="mthumbs">${thumbs(15,3,630,110,92,92,12)}</g>${clip()}
   <g id="tangle" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-dasharray="12 9">
     ${[[676,156,500,177],[780,260,500,255],[884,364,500,489],[676,468,500,333],[780,572,500,411],[884,156,500,567],[676,364,500,645]].map(([a,b,c,d],i)=>`<path class="tg" d="M${a} ${b} C${a-260} ${b+(i%2?160:-120)} ${c+220} ${d+(i%2?-140:120)} ${c} ${d}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>`).join('')}
   </g>
   <text id="mq" class="tag" x="540" y="900" font-size="200" text-anchor="middle" opacity="0">?</text>
   <g id="mweek" opacity="0"><rect x="100" y="-10" width="300" height="72" rx="10" fill="#105572"/><text class="tag" x="250" y="40" font-size="40" text-anchor="middle">אחרי שבוע</text></g>
 </svg></div>

 <div class="scene" id="v-tools"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   <g id="roll" transform="translate(700,380)">
     <path id="ttail" d="M-20 150 L220 230 L205 290 L-35 205 Z" fill="#c8191b"/>
     <circle r="170" fill="#c8191b"/><circle r="170" fill="none" stroke="#e8494a" stroke-width="10" opacity=".6"/><circle r="120" fill="none" stroke="#a51214" stroke-width="4" opacity=".7"/>
     <circle r="78" fill="#07293a" stroke="#d9cfb8" stroke-width="16"/></g>
   <g id="marker" transform="translate(300,420) rotate(-35)">
     <rect x="-40" y="-190" width="80" height="300" rx="20" fill="#f7f8fa"/><rect x="-40" y="-190" width="80" height="70" rx="20" fill="#07293a"/>
     <path d="M-40 110 H40 L20 170 H-20 Z" fill="#cfd7de"/><path d="M-12 170 H12 L4 200 H-4 Z" fill="#07293a"/>
     <text x="0" y="0" transform="rotate(90)" font-family="Heebo" font-weight="900" font-size="34" fill="#07293a" text-anchor="middle">PERMANENT</text></g>
   <g id="price" opacity="0"><rect x="120" y="760" width="420" height="96" rx="48" fill="#fff"/><text x="330" y="824" text-anchor="middle" font-family="Heebo" font-weight="900" font-size="48" fill="#07293a">כמה שקלים ₪</text></g>
 </svg></div>

 <div class="scene" id="v-s1"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   ${wall()}
   <g id="fresh" opacity="0"><circle cx="525" cy="345" r="210" fill="none" stroke="#a90b0c" stroke-width="6" stroke-dasharray="16 12"/>
     <rect x="130" y="80" width="400" height="68" rx="10" fill="#a90b0c"/><text class="tag" x="330" y="126" font-size="36" text-anchor="middle">צבע טרי, לא נוגעים</text></g>
   ${tape(660,300,170,52,-5,'t1')}
   <g id="hand" opacity="0"><path d="M0 0 C30 -20 60 -10 70 20 L80 120 L20 140 Z" fill="#f2c9a8" stroke="#07293a" stroke-width="4"/></g>
   <text class="tag" x="120" y="820" font-size="64" text-anchor="start" style="direction:ltr" fill="#ff6b6b">01</text>
 </svg></div>

 <div class="scene" id="v-s2"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px;overflow:hidden">
   <g id="s2cam">${wall()}${tape(660,300,170,52,-5,'t2')}
   <clipPath id="numclip"><rect id="numrect" x="680" y="270" width="0" height="120"/></clipPath>
   <g clip-path="url(#numclip)"><text x="745" y="345" transform="rotate(-5 745 330)" font-family="Heebo" font-weight="900" font-size="56" fill="#fff" text-anchor="middle" style="direction:ltr">07</text></g>
   <g id="pen" transform="translate(690,300)"><g transform="rotate(-40)"><rect x="-14" y="-170" width="28" height="140" rx="8" fill="#f7f8fa" stroke="#07293a" stroke-width="3"/><path d="M-14 -30 H14 L4 0 H-4 Z" fill="#07293a"/></g></g></g>
   <text x="120" y="820" font-family="Heebo" font-weight="900" font-size="64" text-anchor="start" style="direction:ltr" fill="#c8191b">02</text>
 </svg></div>

 <div class="scene" id="v-s3"><svg width="1080" height="1000" style="position:absolute;left:0;top:190px">
   <g id="s3wall">${wall()}${tape(660,300,170,52,-5)}<text x="745" y="345" transform="rotate(-5 745 330)" font-family="Heebo" font-weight="900" font-size="56" fill="#fff" text-anchor="middle" style="direction:ltr">07</text></g>
   <g id="vf" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round">
     <path id="vf1" d=""/><path id="vf2" d=""/><path id="vf3" d=""/><path id="vf4" d=""/>
     <circle id="focus" cx="600" cy="320" r="30" stroke-width="4"/></g>
   <g id="polaroid" opacity="0"><rect x="-150" y="-170" width="300" height="340" rx="8" fill="#fff"/><rect x="-130" y="-150" width="260" height="240" fill="#e9eef2"/>
     <path d="M-30 -120 L-40 -70 L-20 -45 L-45 0 L-28 30" fill="none" stroke="#3d4b55" stroke-width="5"/>
     <g transform="translate(20,-60) rotate(-5)"><rect width="100" height="32" fill="#c8191b"/><text x="50" y="25" font-family="Heebo" font-weight="900" font-size="26" fill="#fff" text-anchor="middle" style="direction:ltr">07</text></g>
     <text x="0" y="138" font-family="Heebo" font-weight="900" font-size="26" fill="#07293a" text-anchor="middle">המספר בתוך התמונה</text></g>
   <text class="tag" x="120" y="820" font-size="64" text-anchor="start" style="direction:ltr" fill="#ff6b6b">03</text>
 </svg><div id="shutter" style="position:absolute;inset:0;background:#fff;opacity:0"></div></div>

 <div class="scene" id="v-s4">
   <div id="proto" class="paper" style="position:absolute;left:70px;right:70px;top:250px;background:#f7f8fa;color:#07293a;border-radius:10px;overflow:hidden">
     <div class="h" style="background:#07293a;color:#fff;font-size:44px;padding:22px 34px 16px">פרוטוקול מסירה</div>
     <div style="display:grid;grid-template-columns:140px 220px 1fr;font-family:Heebo;font-weight:900;font-size:38px;padding:16px 34px;border-bottom:3px solid #07293a"><span>מס׳</span><span>חדר</span><span>תיאור</span></div>
     ${[['05','מטבח','[תיאור]'],['06','חדר שינה','[תיאור]'],['07','סלון','סדק בטיח']].map(([n,r,d],i)=>`<div class="prow" style="display:grid;grid-template-columns:140px 220px 1fr;align-items:center;font-family:Almoni;font-weight:700;font-size:40px;padding:22px 34px;border-bottom:3px dashed #b7c2cc;${i<2?'opacity:.45':''}">
        <span style="display:inline-block;background:#c8191b;color:#fff;font-family:Heebo;font-weight:900;padding:2px 14px;width:max-content;direction:ltr">${n}</span><span class="pc">${r}</span><span class="pc">${d}</span></div>`).join('')}
   </div>
   <svg width="1080" height="400" style="position:absolute;left:0;top:780px"><g id="lnk" opacity="0"><path d="M260 40 C260 160 520 140 560 250" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="12 10"/>
     <g transform="translate(560,300)"><rect x="-110" y="-60" width="220" height="150" rx="6" fill="#fff"/><rect x="-96" y="-46" width="192" height="100" fill="#e9eef2"/><g transform="translate(-10,-20) rotate(-5)"><rect width="80" height="26" fill="#c8191b"/><text x="40" y="21" font-family="Heebo" font-weight="900" font-size="22" fill="#fff" text-anchor="middle" style="direction:ltr">07</text></g>
     <text x="0" y="80" font-family="Heebo" font-weight="900" font-size="22" fill="#07293a" text-anchor="middle">תמונה 07</text></g></g></svg>
   <div class="h" style="position:absolute;left:80px;top:1060px;font-size:64px;color:#ff6b6b;direction:ltr">04</div>
 </div>

 <div class="scene" id="v-fix"><svg width="1080" height="560" style="position:absolute;left:0;top:200px">
   <g transform="translate(0,-20) scale(1,0.75)">${wall()}</g>
   <g id="ftape">${tape(660,210,170,52,-5)}<text x="745" y="255" transform="rotate(-5 745 240)" font-family="Heebo" font-weight="900" font-size="56" fill="#fff" text-anchor="middle" style="direction:ltr">07</text></g>
   <g id="worker" transform="translate(1200,300)"><path d="M-60 0 A60 60 0 0 1 60 0 Z" fill="#ffd47a"/><rect x="-74" y="-6" width="148" height="18" rx="9" fill="#ffd47a"/><circle cy="60" r="44" fill="#f2c9a8"/><path d="M-80 200 C-80 120 80 120 80 200 Z" fill="#105572"/></g>
   <circle id="fring" cx="745" cy="240" r="120" fill="none" stroke="#fff" stroke-width="6" opacity="0"/>
 </svg>
   <div id="frow" class="paper" style="position:absolute;left:70px;right:70px;top:820px;background:#f7f8fa;color:#07293a;border-radius:10px;display:grid;grid-template-columns:140px 220px 1fr 90px;align-items:center;font-family:Almoni;font-weight:700;font-size:44px;padding:30px 34px">
     <span style="display:inline-block;background:#c8191b;color:#fff;font-family:Heebo;font-weight:900;padding:2px 14px;width:max-content;direction:ltr">07</span><span>סלון</span><span id="fdesc" style="position:relative">סדק בטיח<i id="fstrike" style="position:absolute;right:0;top:52%;height:5px;background:#07293a;width:0"></i></span>
     <svg id="fchk" width="70" height="70" style="opacity:0">${check(35,35,32,true)}</svg>
   </div>
 </div>

 <div class="scene" id="v-insight">
   ${[['iA','רשימת ליקויים',false],['iB','רשימה שנסגרת',true]].map(([id,ttl,ok],j)=>`<div id="${id}" style="position:absolute;${j?'left':'right'}:60px;top:240px;width:460px;height:720px;background:${ok?'#f7f8fa':'rgba(255,255,255,.08)'};border:3px solid ${ok?'#fff':'rgba(255,255,255,.4)'};border-radius:12px;padding:30px;color:${ok?'#07293a':'#fff'};opacity:0">
      <div class="h" style="font-size:52px">${ttl}</div><div style="height:10px;width:120px;background:#a90b0c;margin:16px 0 20px"></div>
      ${[...Array(7)].map((_,i)=>`<div style="display:flex;align-items:center;gap:18px;height:74px;border-bottom:2px dashed ${ok?'#b7c2cc':'rgba(255,255,255,.3)'}">
        <div class="${ok?'ck':'ob'}" style="width:40px;height:40px;border:4px solid ${ok?'#07293a':'rgba(255,255,255,.7)'};border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:Heebo;font-weight:900;font-size:34px;flex:none">${ok?'':'?'}</div>
        <div style="height:16px;border-radius:8px;width:${150+(i*61)%140}px;background:${ok?'#9fb3bf':'rgba(255,255,255,.35)'}"></div></div>`).join('')}
      ${ok?'<div id="closed" class="h" style="position:absolute;left:40px;bottom:120px;transform:rotate(-12deg);border:8px solid #a90b0c;color:#a90b0c;font-size:84px;padding:6px 26px;opacity:0;background:rgba(247,248,250,.85)">נסגרה</div>':''}
   </div>`).join('')}
 </div>

 <div class="scene" id="v-cta">
   <div style="position:absolute;right:80px;left:80px;top:230px">
     ${[['bm','שמרו את השיטה'],['sh','שלחו למי שמקבל מפתח'],['cm','כתבו בתגובות']].map(([k,x],i)=>`<div class="act" style="display:flex;align-items:center;gap:28px;padding:18px 0;border-bottom:3px dashed rgba(255,255,255,.35);opacity:0">
       <div style="width:92px;height:92px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none">${
        k==='bm'?'<svg width="44" height="58"><path d="M2 2 H42 V56 L22 40 L2 56 Z" fill="#a90b0c"/></svg>':
        k==='sh'?'<svg width="56" height="50"><path d="M4 26 L52 4 L36 46 L28 30 Z" fill="#a90b0c"/></svg>':
        '<svg width="56" height="52"><path d="M6 6 H50 V36 H22 L10 48 V36 H6 Z" fill="#a90b0c"/></svg>'}</div>
       <div class="h" style="font-size:58px">${x}</div></div>`).join('')}
     <div style="display:flex;align-items:center;gap:30px;margin-top:28px">
       <div id="bubble" style="display:inline-block;background:#fff;color:#07293a;border-radius:28px 28px 28px 6px;padding:16px 40px;font-family:Heebo;font-weight:900;font-size:70px;opacity:0"><span id="typed"></span><span id="caret" style="color:#a90b0c">|</span></div>
       <div id="tbl" class="lbl" style="font-size:38px;opacity:0;display:flex;align-items:center;gap:14px"><svg width="58" height="50"><rect x="2" y="2" width="54" height="46" rx="4" fill="none" stroke="#fff" stroke-width="4"/><path d="M2 16 H56 M2 31 H56 M20 2 V48" stroke="#fff" stroke-width="3"/></svg>ונשלח טבלה מוכנה</div>
     </div>
   </div>
   <div id="qrrow" style="position:absolute;right:80px;left:80px;top:860px;display:flex;align-items:center;gap:40px;opacity:0;direction:rtl">
     <div style="background:#fff;border-radius:14px;padding:14px;flex:none"><img src="qr.png" style="width:230px;height:230px;display:block"></div>
     <div><div style="font-family:Heebo;font-weight:900;font-size:34px;direction:ltr;text-align:right;white-space:nowrap">kurkoos-group.co.il/management</div>
       <div style="font-family:Heebo;font-weight:900;font-size:58px;direction:ltr;text-align:right;margin-top:14px">055-981-1814</div></div>
   </div>
 </div>`;
 $('#prog').innerHTML=VIS.map(()=>'<div><i></i></div>').join('');
}

const CHIP={hook:'מסירת מפתח',mess:'מסירת מפתח',tools:'השיטה',s1:'01 מדביקים',s2:'02 מספר רץ',s3:'03 מצלמים',s4:'04 פרוטוקול',fix:'תיקון וסגירה',insight:'רשימה שנסגרת',cta:'קבוצת קורקוס'};

function setup(tl){TL=tl; tl.scenes.forEach(s=>S[s.id]=s);
 VIS=tl.scenes.map((s,i)=>({id:s.id,a:i?s.start-0.75:0,b:i<tl.scenes.length-1?tl.scenes[i+1].start-0.75:tl.total}));
 VIS.forEach(v=>VI[v.id]=v); build();}
const w=(sid,i)=>S[sid].words[i<0?S[sid].words.length+i:i].s;
const on=id=>{const v=VI[id];return TT>v.a-0.2&&TT<v.b+0.5;};
let TT=0;

function render(t){ TT=t;
 let cur=0;
 VIS.forEach((v,i)=>{const el=$('#v-'+v.id);
  const inn=i===0?1:eo(seg(t,v.a-0.05,v.a+0.5)), out=i===VIS.length-1?0:seg(t,v.b-0.1,v.b+0.35);
  const vis=t>=v.a-0.05&&t<v.b+0.35; el.style.display=vis?'block':'none'; if(!vis)return;
  if(t>=v.a)cur=i; el.style.opacity=Math.min(inn,1-out);
  el.style.transform=`translateY(${(1-inn)*60-out*40}px) scale(${1+out*0.03})`;});
 const V=VIS[cur];
 $('#chipt').textContent=CHIP[V.id];
 $('#counter').textContent=String(cur+1).padStart(2,'0')+' / '+String(VIS.length).padStart(2,'0');
 [...$('#prog').children].forEach((d,i)=>{const v=VIS[i];d.firstChild.style.width=(seg(t,v.a,v.b)*100)+'%';});
 const red=eo(seg(t,VI.cta.a,VI.cta.a+0.5));
 $('#redbg').style.opacity=red; $('#chip i').style.background=red>.5?'#07293a':'#a90b0c';
 $$('#prog i').forEach(i=>i.style.background=red>.5?'#fff':'#a90b0c');

 // captions (reading pace, phrase by phrase)
 let sc=null; for(const s of TL.scenes){ if(t>=s.start-0.35 && t<s.end+0.9) sc=s; }
 const cl=$('#capline'); const endOn=t>=S.cta.end+0.9;
 if(sc && !endOn){
  let ci=sc.words.findIndex(x=>t<x.e+0.25); if(ci<0)ci=sc.words.length-1;
  const p=sc.words[ci].p; let words=sc.words.filter(x=>x.p===p);
  if(words.length<=1){const nx=sc.words.filter(x=>x.p===p+1); if(nx.length&&nx.length<5)words=words.concat(nx);}
  const key=sc.id+':'+words[0].s;
  if(cl.dataset.key!==key){cl.dataset.key=key;cl.innerHTML=words.map(x=>`<span>${x.t}</span>`).join(' ');}
  const ph=seg(t,words[0].s-0.3,words[0].s), fo=seg(t,sc.end+0.6,sc.end+0.9);
  cl.style.opacity=Math.min(eo(ph),1-fo); cl.style.transform=`translateY(${(1-eo(ph))*26}px)`;
  [...cl.children].forEach((sp,i)=>{const x=words[i],nx=words[i+1];const endA=nx?Math.min(x.e+0.05,nx.s-0.02):x.e+0.4;
   const act=t>=x.s-0.02&&t<endA, done=t>=endA, pop=seg(t,x.s-0.02,x.s+0.14);
   sp.style.opacity=act||done?1:0.3; sp.style.background=act?(red>.5?'#07293a':'#a90b0c'):'transparent';
   sp.style.transform=act?`scale(${1+0.07*Math.sin(pop*Math.PI)})`:'scale(1)';});
 } else cl.style.opacity=0;
 const el=seg(t,S.cta.end+0.9,S.cta.end+1.4); $('#endlogo').style.opacity=eo(el); $('#endlogo').style.transform=`translateY(${(1-eo(el))*40}px)`;

 // hook
 if(on('hook')){ $$('#hthumbs .th').forEach(g=>{const i=+g.dataset.i; const p=back(seg(t,0.3+i*0.09,0.6+i*0.09)); g.setAttribute('opacity',clamp(p*3)); const bb=g.firstChild; const cx=+bb.getAttribute('x')+46, cy=+bb.getAttribute('y')+46; g.setAttribute('transform',`translate(${cx},${cy}) scale(${p}) translate(${-cx},${-cy})`);});
  $$('#hclip .row').forEach(g=>{const i=+g.dataset.i; g.setAttribute('opacity',seg(t,w('hook',6)+i*0.12,w('hook',6)+0.3+i*0.12));});
  $('#hcount').setAttribute('opacity',eo(seg(t,w('hook',5),w('hook',5)+0.4)));}
 // mess
 if(on('mess')){ const a=VI.mess.a; $('#mweek').setAttribute('opacity',eo(seg(t,a+0.2,a+0.6)));
  $$('#mthumbs .th').forEach(g=>{const i=+g.dataset.i; const j=seg(t,w('mess',3),w('mess',5)); g.setAttribute('transform',`translate(${Math.sin(i*2.3+t*3)*8*j},${Math.cos(i*1.7+t*3)*8*j})`);});
  $$('#tangle .tg').forEach((p,i)=>p.setAttribute('stroke-dashoffset',1-eio(seg(t,w('mess',4)+i*0.12,w('mess',4)+0.8+i*0.12))));
  const q=back(seg(t,w('mess',-2),w('mess',-2)+0.4)); $('#mq').setAttribute('opacity',clamp(q)); $('#mq').setAttribute('transform',`translate(540,830) scale(${0.5+0.5*q+0.04*Math.sin(t*6)}) translate(-540,-830)`);}
 // tools
 if(on('tools')){ const r=back(seg(t,w('tools',4)-0.1,w('tools',4)+0.5)); $('#roll').setAttribute('transform',`translate(700,380) rotate(${(1-r)*-200+t*6}) scale(${clamp(r,0,1.2)})`);
  const m=eo(seg(t,w('tools',-1)-0.1,w('tools',-1)+0.5)); $('#marker').setAttribute('transform',`translate(${lerp(-200,300,m)},420) rotate(-35)`);
  $('#price').setAttribute('opacity',eo(seg(t,w('tools',2)-0.1,w('tools',2)+0.3)));}
 // s1: tape sticks next to the crack, not on fresh paint
 if(on('s1')){ const p=eio(seg(t,w('s1',0)-0.1,w('s1',0)+0.7)); $('#t1').setAttribute('transform',`translate(${lerp(1150,660,p)},${lerp(160,300,p)}) rotate(${lerp(-25,-5,p)})`);
  $('#fresh').setAttribute('opacity',eo(seg(t,w('s1',6)-0.1,w('s1',6)+0.4)));}
 // s2: writing the number
 if(on('s2')){ const a=VI.s2.a; const z=eio(seg(t,a,a+0.8)); $('#s2cam').setAttribute('transform',`translate(${745-745*(1+z*.6)},${330-330*(1+z*.6)}) scale(${1+z*.6})`);
  const wr=seg(t,w('s2',1),w('s2',3)+0.2); $('#numrect').setAttribute('width',150*wr); $('#pen').setAttribute('transform',`translate(${700+120*wr},${300+Math.sin(wr*20)*8})`);
  $('#pen').setAttribute('opacity',wr<1?1:1-seg(t,w('s2',3)+0.2,w('s2',3)+0.6));}
 // s3: viewfinder, shutter, polaroid
 if(on('s3')){ const a=VI.s3.a; const f=eio(seg(t,a+0.2,w('s3',0)+0.5)); const x0=lerp(150,380,f),y0=lerp(80,160,f),x1=lerp(930,880,f),y1=lerp(700,500,f),L=60;
  $('#vf1').setAttribute('d',`M${x0} ${y0+L} V${y0} H${x0+L}`); $('#vf2').setAttribute('d',`M${x1-L} ${y0} H${x1} V${y0+L}`); $('#vf3').setAttribute('d',`M${x0} ${y1-L} V${y1} H${x0+L}`); $('#vf4').setAttribute('d',`M${x1-L} ${y1} H${x1} V${y1-L}`);
  $('#focus').setAttribute('cx',(x0+x1)/2); $('#focus').setAttribute('cy',(y0+y1)/2);
  const sh=w('s3',2); $('#shutter').style.opacity=Math.max(0,1-Math.abs(t-sh)/0.12)*0.9;
  const pp=eio(seg(t,sh+0.15,sh+0.9)); $('#polaroid').setAttribute('opacity',pp>0?1:0); $('#polaroid').setAttribute('transform',`translate(${lerp(540,300,pp)},${lerp(400,560,pp)}) rotate(${lerp(0,-8,pp)}) scale(${lerp(1.6,1,pp)})`);
  $('#vf').setAttribute('opacity',1-seg(t,sh+0.1,sh+0.4)); $('#s3wall').setAttribute('opacity',1-0.5*seg(t,sh+0.2,sh+0.6));}
 // s4: protocol row typed
 if(on('s4')){ const a=VI.s4.a; const p=eo(seg(t,a,a+0.6)); $('#proto').style.transform=`translateY(${(1-p)*60}px)`; $('#proto').style.opacity=p;
  const rows=$$('#v-s4 .prow'); const last=rows[2]; const tp=seg(t,w('s4',2),w('s4',-1)+0.2);
  last.style.background=tp>0?'rgba(169,11,12,.08)':'transparent'; last.querySelectorAll('.pc').forEach((c,i)=>{const full=['סלון','סדק בטיח'][i]; c.textContent=full.slice(0,Math.round(clamp(tp*2-i)*full.length));});
  $('#lnk').setAttribute('opacity',eo(seg(t,w('s4',4),w('s4',4)+0.5)));}
 // fix: contractor finds tape, tape removed, row checked
 if(on('fix')){ const wk=eio(seg(t,w('fix',0),w('fix',2)+0.3)); $('#worker').setAttribute('transform',`translate(${lerp(1200,920,wk)},300)`);
  const fr=seg(t,w('fix',3),w('fix',6)); $('#fring').setAttribute('opacity',fr>0&&fr<1?1:fr>=1?Math.max(0,1-(t-w('fix',6))*2):0); $('#fring').setAttribute('r',120-40*eo(fr));
  const off=eio(seg(t,w('fix',8),w('fix',9)+0.3)); $('#ftape').setAttribute('transform',`translate(${off*300},${-off*260}) rotate(${off*40} 745 240)`); $('#ftape').setAttribute('opacity',1-off);
  const ck=back(seg(t,w('fix',10)+0.1,w('fix',10)+0.5)); $('#fchk').style.opacity=clamp(ck); $('#fchk').style.transform=`scale(${clamp(ck,0,1.3)})`;
  $('#fstrike').style.width=(100*eio(seg(t,w('fix',10),w('fix',10)+0.5)))+'%';}
 // insight
 if(on('insight')){ const A=eo(seg(t,w('insight',4)-0.2,w('insight',4)+0.3)); $('#iA').style.opacity=A; $('#iA').style.transform=`translateY(${(1-A)*40}px)`;
  const B=eo(seg(t,w('insight',7)-0.2,w('insight',7)+0.3)); $('#iB').style.opacity=B; $('#iB').style.transform=`translateY(${(1-B)*40}px)`;
  $$('#iB .ck').forEach((c,i)=>{const on_=t>w('insight',7)+0.3+i*0.16; c.textContent=on_?'✓':''; c.style.background=on_?'#07293a':'transparent'; c.style.color='#fff';});
  const cl=back(seg(t,w('insight',-1),w('insight',-1)+0.4)); const el2=$('#closed'); el2.style.opacity=clamp(cl); el2.style.transform=`rotate(-12deg) scale(${lerp(1.8,1,clamp(cl))})`;}
 // cta
 if(on('cta')){ const marks=[w('cta',0),w('cta',3),w('cta',8)];
  $$('#v-cta .act').forEach((e,i)=>{const p=back(seg(t,marks[i]-0.1,marks[i]+0.35)); e.style.opacity=clamp(p); e.style.transform=`translateX(${(1-clamp(p))*-60}px)`;});
  $('#bubble').style.opacity=eo(seg(t,w('cta',9)-0.1,w('cta',9)+0.3));
  const word='סרט', n=Math.floor(clamp((t-w('cta',9))/0.45)*word.length+0.0001); $('#typed').textContent=word.slice(0,n); $('#caret').style.opacity=Math.floor(t*2.5)%2?0:1;
  $('#tbl').style.opacity=eo(seg(t,w('cta',11)-0.1,w('cta',11)+0.4));
  const q=eo(seg(t,S.cta.end+0.3,S.cta.end+0.9)); $('#qrrow').style.opacity=q; $('#qrrow').style.transform=`translateY(${(1-q)*40}px)`;}
}
window.__ready=fetch('timeline.json').then(r=>r.json()).then(tl=>{setup(tl);render(0);return document.fonts.ready;}).then(()=>true);
